<header class="top">
  <span class="brand"><i></i>flow-studio</span>
  <span class="spacer"></span>
  <button id="notesBtn" type="button" aria-pressed="false">Implementation notes (N)</button>
  <button id="theme" type="button" aria-label="Toggle light and dark">☀ / ☾</button>
</header>
<main>
  <div class="titlerow"><h1 id="title"></h1><span class="readline" id="readat"></span></div>
  <p class="help" id="help"></p>
  <div id="banner" role="alert" hidden></div>

  <section class="summary"><div class="layerstrip" id="layerstrip" aria-label="Completeness by column"></div><div class="tiles" id="kpis" aria-label="Summary"></div></section>

  <div class="toolbar">
    <div class="seggrp" role="tablist" aria-label="View" id="modeSwitch"></div>
    <input id="q" type="search" placeholder="Find a group or member…  ( / )" aria-label="Find a group or member">
    <select id="hops" aria-label="Search radius"><option value="0">This group</option><option value="1">+1 hop</option><option value="2">+2 hops</option><option value="3">+3 hops</option></select>
    <span id="matchinfo" class="note" style="margin:0"></span>
  </div>

  <div class="workspace" id="workspace">
    <section class="canvaswrap">
      <div id="viewport" tabindex="0" role="application" aria-label="Flow canvas. Scroll to zoom, drag to pan. Keys: V select, H hand, plus and minus zoom, 0 fit, 1 actual size, F zoom to selection, arrows pan.">
        <div id="world"><svg id="edges" aria-hidden="true"><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs><g id="edgeLayer"></g></svg></div>
        <div id="cols" aria-hidden="true"></div>
        <div id="tools" role="toolbar" aria-label="Canvas controls" aria-orientation="vertical"></div>
        <div id="zoomLabel" aria-hidden="true">100%</div>
      </div>
      <div id="playbar" hidden aria-label="Scenario playback">
        <select id="pbScenario" aria-label="Scenario"></select>
        <button id="pbPlay" type="button" aria-label="Play">▶</button>
        <button id="pbStep" type="button" aria-label="Step">Step</button>
        <button id="pbReset" type="button" aria-label="Reset">Reset</button>
        <select id="pbSpeed" aria-label="Speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
        <input id="pbScrub" type="range" min="0" max="1000" value="0" aria-label="Playback position" aria-valuetext="Step 1 of 1">
        <span id="pbCaption"></span><span id="pbCounter"></span><span id="pbChoices"></span>
      </div>
      <div class="keyline" id="legend" aria-label="Legend"></div>
      <aside class="insp" id="inspector" aria-label="Inspector" aria-hidden="true"></aside>
    </section>
  </div>
  <div id="live" class="sr" role="status" aria-live="polite"></div>

  <div class="ledger" id="ledger"></div>
  <details class="tableview"><summary>Table view</summary><table class="sources" id="tbl"></table></details>
  <details class="spec" id="spec"><summary>Model reference (for the person or agent who builds this)</summary><div id="specbody"></div></details>
</main>
<footer id="footer"></footer>
<aside id="drawer" aria-label="Implementation notes"><h2>Implementation notes</h2><p class="note">Numbered markers on the page match these cards. Hover a card to find its place; click a marker to jump to its card.</p><div id="notelist"></div></aside>
